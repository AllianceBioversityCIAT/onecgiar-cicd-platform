# @akili-spec changes/cicd-executor-poc requirements NFR-08; design DD-19, DD-23
# NFR-08 fixture: a SECOND, entirely fictitious pipeline definition following
# the exact same pattern as pipeline-definitions/prms/reporting-dev.yaml
# (lambda quality -> codebuild -> ssh deploy -> notify), with a fake
# project/pipeline/target id ("atlas-sync", never cited anywhere in the
# spec as a real project) and only logical `<...>` placeholders, proving
# "adding a pipeline of the same pattern requires only a definition and a
# registry entry, with no code changes to the Executor" (requirements.md
# NFR-08). Lives under executor/test/fixtures — NOT under
# pipeline-definitions/, since it is test data, not a real pipeline.

schemaVersion: 1
pipelineId: atlas-sync-dev
project: atlas-sync
environment: dev

repository:
  url: <ATLAS_SYNC_REPO_URL>
  branch: <ATLAS_SYNC_DEV_BRANCH>
  credentialRef: <GITHUB_CREDENTIAL_REF>

triggers:
  - type: manual

notifications:
  slack:
    channel: <ATLAS_SYNC_SLACK_CHANNEL>
    tokenRef: <SLACK_TOKEN_REF>

source:
  packages:
    - name: worker
      path: <ATLAS_SYNC_WORKER_DIR>

steps:
  - id: worker-quality
    type: lambda
    with:
      function: <QUALITY_WORKER_FUNCTION>
      task: backend-quality
      package: worker

  - id: worker-image
    type: codebuild
    needs: [worker-quality]
    with:
      project: atlas-sync-dev
      package: worker
      env:
        COMPONENT: worker

  - id: deploy
    type: ssh
    needs: [worker-image]
    timeoutMinutes: 20
    with:
      target: atlas-sync-dev
      script: deploy-container.sh
      args:
        - --execution-id=${execution.id}
        - --unit=atlas-sync-dev-unit
        - --image=worker=${steps.worker-image.outputs.imageUri}

finally:
  - id: notify
    type: notify
