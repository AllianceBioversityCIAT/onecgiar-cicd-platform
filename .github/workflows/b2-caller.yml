# THROWAWAY B2 CALLER (docs/gate-b/03-github.md sections 6 to 8). Lives only on the bound branch
# b2-session-probe; never merged into main.
#
# L9 (first live flow, stage 1): calls the trusted R-8 reusable workflow at the SHA the CI role
# trust pins (PinnedWorkflowSha), with the full owner/repo/path@SHA form so job_workflow_ref
# matches. The run builds and pushes one minimal image (b2/Dockerfile, FROM scratch), assumes the
# CI role through OIDC with the session name = repository id, and sends exactly ONE
# DEPLOY_REQUESTED for targetId "b2-probe", which is NOT registered: the Executor must reject it
# with TARGET_UNKNOWN. No target exists, so nothing is deployed and no SSH connection is possible.
#
# Trigger: push to b2-session-probe only (workflow_dispatch needs the file on the default branch).
# Each push starts one run; a GitHub re-run would send a second request with a new request id.
name: b2-caller

on:
  push:
    branches: ["b2-session-probe"]

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo "B2 first live flow; no lint or tests"

  deploy:
    needs: ci
    # The called job can only get what the caller grants: an OIDC token and read access.
    permissions:
      id-token: write
      contents: read
    uses: AllianceBioversityCIAT/onecgiar-cicd-platform/.github/workflows/deploy-request.reusable.yml@7f148ceb90e494edd4b87a161524936c4f7ded94
    with:
      targetId: "b2-probe"
      environment: "cicd-poc-dev"
      units: '[{"unit":"probe","context":"b2","dockerfile":"b2/Dockerfile"}]'
