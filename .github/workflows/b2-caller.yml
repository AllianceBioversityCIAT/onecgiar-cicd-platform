# THROWAWAY B2 CALLER (docs/gate-b/03-github.md sections 6 to 8). Lives only on the bound branch
# b2-session-probe; never merged into main.
#
# It calls the reusable workflow path pinned in the CI role trust, at the SHA the stack pins
# (PinnedWorkflowSha), with the full owner/repo/path@SHA form so job_workflow_ref matches.
# At 3840f99 that file is the session-name probe: it records the OIDC claims and calls
# AssumeRoleWithWebIdentity with three session names. It pushes no image, sends no SQS
# message and changes no AWS resource. The inputs are required by the reusable workflow
# interface; the probe ignores them.
#
# Trigger: push to b2-session-probe only (workflow_dispatch needs the file on the default branch).
name: b2-caller

on:
  push:
    branches: ["b2-session-probe"]

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - run: echo "B2 probe run; no lint or tests"

  deploy:
    needs: ci
    # The called job can only get what the caller grants: an OIDC token and read access.
    permissions:
      id-token: write
      contents: read
    uses: AllianceBioversityCIAT/onecgiar-cicd-platform/.github/workflows/deploy-request.reusable.yml@3840f99a2d217f5c4342c45935e3e26cb055ade5
    with:
      targetId: "b2-probe"
      environment: "cicd-poc-dev"
      units: '[{"unit":"probe","context":"."}]'
