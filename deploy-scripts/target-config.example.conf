# EXAMPLE target configuration for deploy-container.sh (design §6.5, task R-9a).
# Install as /etc/cicd/targets/<TARGET_ID>.conf on the target, owned by an
# administrator and NOT writable by the deploy user (V1-R3). Read as KEY=VALUE
# lines, never sourced. Placeholders in angle brackets are resolved on the
# target only and never committed with real values (DD-23).
#
# One block per unit the caller workflow builds; the unit names must equal the
# `unit` values of the caller's `units` input.

unit.<UNIT>.repository=<AWS_ACCOUNT_ID>.dkr.ecr.<AWS_REGION>.amazonaws.com/<ECR_REPOSITORY>
unit.<UNIT>.container=<CONTAINER_NAME>
# unit.<UNIT>.port=<HOST_PORT>:<CONTAINER_PORT>
# unit.<UNIT>.health=http://127.0.0.1:<HOST_PORT>/<HEALTH_PATH>
# unit.<UNIT>.runtime-secret=<TARGET_SIDE_SECRET_REFERENCE>
# unit.<UNIT>.migrate.check=<COMMAND_EXITING_0_WHEN_UP_TO_DATE>
# unit.<UNIT>.migrate.run=<MIGRATION_COMMAND>
# migration-mode=ephemeral
